name: ci
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pyflakes kreutz tests
      - run: bash -n scripts/*.sh
      - run: python -c "import kreutz.frames, kreutz.search, kreutz.lane, kreutz.evaluate, kreutz.shortlist, kreutz.weekly, kreutz.live, kreutz.render, kreutz.style, kreutz.notify, kreutz.score, kreutz.report"
      - run: pytest -q
