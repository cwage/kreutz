name: ci
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pyflakes kreutz tests
      - run: bash -n scripts/*.sh
      - run: python -c "import importlib, pkgutil, kreutz; [importlib.import_module('kreutz.' + m.name) for m in pkgutil.iter_modules(kreutz.__path__)]"
      - run: pytest -q
