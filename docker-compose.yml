services:
  kreutz:
    build: .
    # Run as the host user so files written to the bind mount aren't
    # root-owned (this host runs rootful docker).
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./data:/data
      # Code is bind-mounted so edits don't need a rebuild; only
      # requirements.txt changes do.
      - ./kreutz:/srv/kreutz:ro
    # Each container gets at most this much CPU, and the numeric libraries
    # one thread each: several runs side by side add up to a known load
    # instead of all of them fanning out across every core.
    cpus: ${KREUTZ_CPUS:-1.5}
    environment:
      # Which coronagraph: ccor1 (default) or ccor2. See kreutz/instrument.py.
      KREUTZ_INSTRUMENT: ${KREUTZ_INSTRUMENT:-ccor1}
      # For kreutz.notify (the live watcher's --notify): where alerts go.
      NTFY_SERVER: ${NTFY_SERVER:-https://ntfy.sh}
      NTFY_TOPIC: ${NTFY_TOPIC:-}
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"

  # The status page (kreutz.page writes data/index.html) and everything it
  # links to, read-only: http://localhost:8000/
  web:
    image: python:3.12-slim
    user: "${UID:-1000}:${GID:-1000}"
    command: ["python", "-m", "http.server", "-d", "/data", "8000"]
    volumes:
      - ./data:/data:ro
    ports:
      - "${KREUTZ_WEB_PORT:-8000}:8000"
    restart: unless-stopped
