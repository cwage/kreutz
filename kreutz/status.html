<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kreutz live</title>
<style>
  :root { --bg: #0d0f12; --card: #171a20; --line: #2a2f38; --fg: #d8dce3; --dim: #8a919c;
          --hot: #f2a93b; --ok: #5ac46a; --known: #6ea8fe; --bad: #8a919c; }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--fg);
         font: 14px/1.45 system-ui, sans-serif; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  h2 { font-size: 13px; color: var(--dim); text-transform: uppercase; letter-spacing: .06em;
       margin: 24px 0 8px; }
  .meta { color: var(--dim); }
  .following .row { background: var(--card); border: 1px solid var(--line); border-radius: 8px;
                    padding: 10px 12px; margin-bottom: 8px; }
  a { color: inherit; } .badge a { color: #000; }
  .badge { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 12px;
           font-weight: 600; color: #000; margin: 0 6px 4px 0; max-width: 100%; box-sizing: border-box; }
  .candidate { background: var(--hot); } .confirmed { background: var(--ok); }
  .known { background: var(--known); } .quiet { background: var(--bad); }
  .hint { background: none; color: var(--known); border: 1px solid var(--known); font-weight: 500; } .hint a { color: var(--known); }
  .lead { background: var(--ok); } .lag { background: var(--line); color: var(--fg); font-weight: 500; }
  .row { display: flex; gap: 12px; align-items: flex-start; padding: 8px 0; border-top: 1px solid var(--line); }
  .row img { width: 160px; border-radius: 4px; background: #000; flex: none; }
  code { color: var(--fg); background: #000; padding: 1px 5px; border-radius: 3px; font-size: 12px; }
  .cmd { display: block; white-space: pre-wrap; overflow-wrap: anywhere; margin-top: 4px; }
  .empty { color: var(--dim); font-style: italic; }
  .row img { cursor: zoom-in; }
  img[tabindex]:focus-visible { outline: 2px solid var(--hot); outline-offset: 2px; }
  dialog { background: var(--card); color: var(--fg); border: 1px solid var(--line); border-radius: 8px;
           padding: 12px; max-width: calc(100vw - 32px); }
  dialog::backdrop { background: rgba(0, 0, 0, .8); }
  dialog img { display: block; max-width: calc(100vw - 56px); max-height: calc(100vh - 140px);
               background: #000; margin: 8px auto 0; }
  .bar { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; }
  .bar button { background: none; border: 1px solid var(--line); color: var(--fg); border-radius: 999px;
                padding: 2px 10px; cursor: pointer; font: inherit; font-size: 12px; }
  .bar button.on { background: var(--fg); color: #000; border-color: var(--fg); }
  .bar .x { margin-left: auto; }
  .inst { background: none; color: var(--fg); border: 1px solid var(--dim); font-weight: 500; }
  .watchers { margin: 6px 0 0; }
  .watchers div { color: var(--dim); }
  .watchers b { color: var(--fg); }
  .watchers .down b { color: var(--dim); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .chips button { background: none; border: 1px solid var(--line); color: var(--fg); border-radius: 999px;
                  padding: 2px 10px; cursor: pointer; font: inherit; font-size: 12px; }
  .chips button.on { background: var(--fg); color: #000; border-color: var(--fg); }
</style>
</head>
<body>
<h1>kreutz live</h1>
<div class="watchers" id="meta">loading instruments.json…</div>
<div class="chips" id="chips"></div>

<h2>Following</h2>
<div class="following" id="following"></div>

<h2>Recent decisions</h2>
<div id="recent"></div>

<dialog id="box">
  <div class="bar">
    <b id="box-name"></b>
    <span id="box-views"></span>
    <span id="box-styles"></span>
    <a id="box-file" href="" target="_blank" rel="noopener">open file</a>
    <button class="x" onclick="document.getElementById('box').close()">close</button>
  </div>
  <img id="box-img" alt="">
</dialog>

<script>
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
const hhmm = iso => iso ? iso.slice(5, 16).replace('T', ' ') + ' UTC' : '?';
const ago = iso => {
  const m = Math.round((Date.now() - Date.parse(iso + 'Z')) / 60000);
  return m < 60 ? `${m} min ago` : `${(m / 60).toFixed(1)} h ago`;
};
const link = (k, text) => k && k.url ? `<a href="${esc(k.url)}" target="_blank" rel="noopener">${text}</a>` : text;
// The Sungrazer report that fits the object, as of the last snapshot: by
// position, a report from this instrument; or by time (and lane), a
// report from another coronagraph that is only likely the same object.
// Only a match by position (or by one orbit through the report's points
// and our track, for a comet followed long after it was reported) means
// the object is reported here: one by time
// leaves it unreported in this instrument, with the other report as a hint
// (2026-10-23: a bright CCOR-1 comet read as "likely Chuck Fields's" off
// a C3 report, and looked taken when nobody had reported it in CCOR-1).
const reportedHere = k => !!k && (k.how === 'position' || k.how === 'orbit');
const reportBadge = (k, inst) => {
  if (!k) return `<span class="badge candidate">UNREPORTED</span>`;
  const when = k.posted_utc ? ` ${hhmm(k.posted_utc)}` : '';
  if (reportedHere(k)) {
    return `<span class="badge known">${link(k, `reported by ${esc(k.reporter || k.id)}${when}${k.telescope ? ` (${esc(k.telescope)})` : ''}`)}</span>`;
  }
  const here = inst ? ` in ${esc(inst.label)}` : '';
  const hint = `maybe ${esc(k.reporter)}'s ${esc(k.telescope || 'other-instrument')} comet,${when} (same time, not by position)`;
  return `<span class="badge candidate">UNREPORTED${here}</span><span class="badge hint">${link(k, hint)}</span>`;
};
const bust = (p, iso) => p ? `${p}?${encodeURIComponent(iso || '')}` : null;
const utc = iso => Date.parse(iso.endsWith('Z') ? iso : iso + 'Z');
const span = ms => {
  const m = Math.round(Math.abs(ms) / 60000);
  return m < 90 ? `${m} min` : m < 48 * 60 ? `${(m / 60).toFixed(1)} h` : `${(m / 1440).toFixed(1)} d`;
};
// Who was first: the report's posting against when this watcher found the
// object (its candidate alert), and against when it confirmed it.
const leadBadge = (k, foundIso, confirmedIso) => {
  if (!k || !k.posted_utc || !foundIso) return '';
  const d = utc(k.posted_utc) - utc(foundIso);
  let conf = '';
  if (confirmedIso) {
    const dc = utc(k.posted_utc) - utc(confirmedIso);
    conf = ` · confirmed here ${span(dc)} ${dc >= 0 ? 'before' : 'after'} the report`;
  }
  return d >= 0
    ? `<span class="badge lead" title="found here ${hhmm(foundIso)}, report posted ${hhmm(k.posted_utc)}${conf}">found here ${span(d)} before the report</span>`
    : `<span class="badge lag" title="report posted ${hhmm(k.posted_utc)}, found here ${hhmm(foundIso)}${conf}">reported ${span(d)} before we found it</span>`;
};
// a thumbnail that opens the lightbox, by mouse or by Enter/Space
const opener = name => `role="button" tabindex="0" onclick="openBox('${esc(name)}')" `
  + `onkeydown="if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); openBox('${esc(name)}'); }"`;

// A followed object: laid out like a decided one, picture left, text right.
function card(f) {
  const stage = f.stage === 'confirmed'
    ? `<span class="badge confirmed">confirmed, ${f.points} frames</span>`
    : `<span class="badge candidate">candidate, ${f.points} frame${f.points === 1 ? '' : 's'} measured</span>`;
  const pic = f.pictures ? bust(f.pictures.preview, f.pictures.made_utc) : bust(f.gif, f.first);
  const what = f.pictures ? 'render so far; click for more' : 'vetting animation';
  return `<div class="row">
    <img src="${pic}" alt="${what}" title="${what}" loading="lazy" ${opener(f._key)}>
    <div>${instBadge(f)}${stage}${reportBadge(f.report, f._inst)}${reportedHere(f.report) ? leadBadge(f.report, f.decided_utc, f.confirmed_utc) : ''}
      <div class="meta">${esc(f.name)} · first seen ${hhmm(f.first)} · last seen ${hhmm(f.last_seen)}
        · at ${f.x.toFixed(0)},${f.y.toFixed(0)} · ${Math.hypot(f.vx, f.vy).toFixed(1)} px/frame
        ${f.misses ? `· missing ${f.misses} frame(s)` : ''}${f.rendering ? ' · rendering…' : ''}
        ${f.others ? `· ${f.others} Kreutz report(s) from other instruments` : ''}
        ${f.found_by === 'orbit' && f.paged === false ? '· orbit search only, not paged' : f.paged === false ? `· ${f.heading_deg}° off sunward, not paged` : f.near_lane === false ? `· ${f.lane_px} px off the lane, not paged` : ''}</div>
      <code class="cmd">${esc(f._inst.measure_prefix)}${esc(f.alert)}</code>
    </div></div>`;
}

const LABEL = {alert: 'candidate', confirmed: 'confirmed', reported: 'already reported',
               star: 'a star', stationary: 'not moving', 'off-lane': 'off the lane',
               ghost: 'yesterday\'s ghost', line: 'a line, not a point',
               rejected: 'rejected', faded: 'faded', ended: 'ended'};
// an ended object either left the field or was lost by the follow-up in
// view; older entries don't say which
const label = r => r.kind !== 'ended' ? (LABEL[r.kind] || r.kind)
  : r.where === 'edge' ? 'left the field' : r.where === 'lost' ? 'lost by the follow-up' : 'ended';
const JUNK = ['star', 'stationary', 'off-lane', 'ghost', 'line', 'rejected', 'faded'];  // never 'unreported'
const STYLE = {alert: 'candidate', confirmed: 'confirmed', reported: 'known'};

// One row per object: its decisions in the log, oldest first.
function group(recent) {
  const by = new Map();
  for (const r of recent) {
    const key = `${r._inst.key}:${r.name || `${r.kind}@${r.decided_utc}`}`;
    if (!by.has(key)) by.set(key, []);
    by.get(key).unshift(r);  // recent is newest-first; keep each history oldest-first
  }
  return [...by.values()].sort((a, b) => b.at(-1).decided_utc.localeCompare(a.at(-1).decided_utc));
}

function row(hist) {
  const last = hist.at(-1), first = hist[0];
  // the report it's matched to: on its latest entry, else on any earlier
  // one (an older 'ended' entry carries no match, and the live report feed
  // may be down when the page is written)
  const matched = last.report || [...hist].reverse().map(r => r.report).find(Boolean) || null;
  // noise that faded, or a star, isn't 'unreported'; only a real match is worth a badge
  const report = JUNK.includes(last.kind) && !matched ? '' : reportBadge(matched, last._inst);
  // when it was found and confirmed: on the record itself (from the alert
  // files), else from whatever of its history is in the window
  const found = last.found_utc || (hist.find(r => ['alert', 'reported'].includes(r.kind)) || {}).decided_utc;
  const confirmed = last.confirmed_utc || (hist.find(r => r.kind === 'confirmed') || {}).decided_utc;
  const lead = report && reportedHere(matched) ? leadBadge(matched, found, confirmed) : '';
  const extra = last.kind === 'confirmed' ? ` ${last.frames} frames, ${esc(last.note)}`
              : last.kind === 'ended' ? ` after ${last.frames} frames`
              : last.note ? ` ${esc(last.note)}` : '';
  const timeline = hist.map(r => `${label(r)} ${hhmm(r.decided_utc).slice(6, 11)}`).join(' → ');
  const pic = last.pictures ? last.pictures.preview : last.gif;
  const stamp = last.pictures ? last.pictures.made_utc : last.decided_utc;
  return `<div class="row">
    ${pic ? `<img src="${bust(pic, stamp)}" alt="pictures of ${esc(last.name)}" loading="lazy" ${opener(last._key)}>` : ''}
    <div>${instBadge(last)}<span class="badge ${STYLE[last.kind] || 'quiet'}">${label(last)}</span>${report}${lead}${extra}
      <div class="meta">${timeline} UTC (${ago(last.decided_utc)}) · seen ${hhmm(first.first)} → ${hhmm(last.last)}
        at ${last.x.toFixed(0)},${last.y.toFixed(0)}${last.name ? ` · ${esc(last.name)}` : ''}</div>
    </div></div>`;
}

// The lightbox: one object's pictures, by view (crop, field, still, or the
// plain preview) and style preset. The last choice is remembered.
let objects = {}, boxState = {name: null, view: 'field', style: 'soft'};
try { Object.assign(boxState, JSON.parse(localStorage.getItem('box') || '{}'), {name: null}); } catch (e) {}

function pictureFor(o, view, style) {
  const p = o.pictures;
  if (!p) return view === 'preview' ? o.gif : null;
  if (view === 'preview') return p.preview;
  return (p.styles[style] || {})[view] || null;
}

function openBox(name) {
  boxState.name = name;
  drawBox();
  const box = document.getElementById('box');
  if (!box.open) box.showModal();
  history.replaceState(null, '', `#${name}`);
}

function drawBox() {
  const o = objects[boxState.name];
  if (!o) return;
  const styles = o.pictures ? Object.keys(o.pictures.styles) : [];
  if (!styles.includes(boxState.style)) boxState.style = styles[0] || null;
  const views = o.pictures ? ['field', 'crop', 'still', 'preview'] : ['preview'];
  if (!pictureFor(o, boxState.view, boxState.style)) {
    boxState.view = views.find(v => pictureFor(o, v, boxState.style)) || 'preview';
  }
  const src = pictureFor(o, boxState.view, boxState.style);
  const btn = (key, val, on) => `<button class="${on ? 'on' : ''}" onclick="pick('${key}', '${val}')">${val}</button>`;
  document.getElementById('box-name').textContent = `${o._inst.label} · ${o.name}`;
  document.getElementById('box-views').innerHTML =
    views.map(v => btn('view', v, v === boxState.view)).join('');
  document.getElementById('box-styles').innerHTML =
    boxState.view === 'preview' ? '' : styles.map(st => btn('style', st, st === boxState.style)).join('');
  document.getElementById('box-img').src = src ? bust(src, o.stamp) : '';
  document.getElementById('box-file').href = src || '';
  try { localStorage.setItem('box', JSON.stringify({view: boxState.view, style: boxState.style})); } catch (e) {}
}

function pick(key, val) { boxState[key] = val; drawBox(); }
document.getElementById('box').addEventListener('close', () => history.replaceState(null, '', ' '));

// Every instrument's watcher, from instruments.json (kreutz.page): each
// has its own live directory, and paths in its status.json are relative
// to that directory, so they're rebased here onto this page's.
const instBadge = o => SHOWN.length > 1 ? `<span class="badge inst">${esc(o._inst.label)}</span>` : '';
let SHOWN = [];
let only = null;
try { only = localStorage.getItem('only'); } catch (e) {}

function rebase(o, inst) {
  const at = p => p ? `${inst.live}/${p}` : p;
  const out = {...o, _inst: inst, _key: `${inst.key}:${o.name}`, gif: at(o.gif)};
  if (o.pictures) {
    const styles = {};
    for (const [k, v] of Object.entries(o.pictures.styles || {})) {
      styles[k] = Object.fromEntries(Object.entries(v).map(([view, path]) => [view, at(path)]));
    }
    out.pictures = {...o.pictures, preview: at(o.pictures.preview), styles};
  }
  return out;
}

function watcherLine(inst, s, err) {
  if (!s) return `<div class="down"><b>${esc(inst.label)}</b> · no watcher (${esc(err)})</div>`;
  const stale = (Date.now() - Date.parse(s.updated_utc + 'Z')) > 45 * 60000;
  return `<div><b>${esc(inst.label)}</b> · window ${hhmm(s.window_utc)} · updated ${ago(s.updated_utc)}${stale ? ' <b>(stale: is the watcher running?)</b>' : ''}${s.waiting ? ` · <b>${esc(s.waiting)}</b>` : ''}
    · ${s.open} open chain(s)${s.longest ? `, longest ${s.longest} window(s) at ${s.longest_at[0].toFixed(0)},${s.longest_at[1].toFixed(0)}` : ''}</div>`;
}

function setOnly(key) {
  only = key;
  try { key ? localStorage.setItem('only', key) : localStorage.removeItem('only'); } catch (e) {}
  refresh();
}

async function refresh() {
  let insts;
  try {
    insts = await (await fetch('instruments.json', {cache: 'no-store'})).json();
  } catch (e) {
    document.getElementById('meta').textContent = `instruments.json not readable (run kreutz.page): ${e}`;
    return;
  }
  const got = await Promise.all(insts.map(async inst => {
    try {
      const r = await fetch(`${inst.live}/status.json`, {cache: 'no-store'});
      if (!r.ok) return {inst, err: r.status === 404 ? 'not started' : `HTTP ${r.status}`};
      return {inst, s: await r.json()};
    } catch (e) {
      return {inst, err: String(e)};
    }
  }));
  const running = got.filter(g => g.s);
  if (only && !running.some(g => g.inst.key === only)) only = null;
  SHOWN = running.filter(g => !only || g.inst.key === only);
  document.getElementById('meta').innerHTML =
    got.filter(g => g.s || !only).map(g => watcherLine(g.inst, g.s, g.err)).join('')
    + '<div>chains under three windows are mostly noise and aren\'t shown</div>';
  document.getElementById('chips').innerHTML = running.length > 1
    ? [`<button class="${only ? '' : 'on'}" onclick="setOnly(null)">all</button>`,
       ...running.map(g => `<button class="${only === g.inst.key ? 'on' : ''}" onclick="setOnly('${esc(g.inst.key)}')">${esc(g.inst.label)}</button>`)].join('')
    : '';
  const following = [], recent = [];
  for (const {inst, s} of SHOWN) {
    following.push(...s.following.map(f => rebase(f, inst)));
    recent.push(...s.recent.map(r => rebase(r, inst)));
  }
  following.sort((a, b) => (b.last_seen || '').localeCompare(a.last_seen || ''));
  recent.sort((a, b) => b.decided_utc.localeCompare(a.decided_utc));  // newest first, as one watcher writes it
  objects = {};
  const newest = SHOWN.map(g => g.s.updated_utc).sort().at(-1);
  for (const f of following) objects[f._key] = {...f, stamp: f.pictures ? f.pictures.made_utc : newest};
  for (const r of recent) if (r.name && !objects[r._key]) objects[r._key] = {...r, stamp: r.pictures ? r.pictures.made_utc : r.decided_utc};
  document.getElementById('following').innerHTML =
    following.length ? following.map(card).join('') : '<div class="empty">nothing being followed</div>';
  document.getElementById('recent').innerHTML =
    recent.length ? group(recent).map(row).join('') : '<div class="empty">no decisions yet</div>';
  const title = only ? `kreutz live · ${running.find(g => g.inst.key === only).inst.label}` : 'kreutz live';
  document.title = title;
  document.querySelector('h1').textContent = title;
  if (boxState.name) drawBox();
  else if (location.hash.length > 1) {
    // old links carry a bare name; find it under any instrument
    const h = decodeURIComponent(location.hash.slice(1));
    const key = objects[h] ? h : Object.keys(objects).find(k => k.endsWith(`:${h}`));
    if (key) openBox(key);
  }
}
refresh();
setInterval(refresh, 60000);
</script>
</body>
</html>
